name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit:
    name: lint-typecheck-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workflows
      - run: pnpm test:tooling
      - run: pnpm turbo run build lint typecheck test
      - name: Coverage reports (core, contracts, integrations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: packages/*/coverage/
          retention-days: 7
          if-no-files-found: warn

  integration:
    name: integration
    needs: lint-typecheck-unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: redova
          POSTGRES_PASSWORD: redova
          POSTGRES_DB: redova
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redova -d redova" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # SMTP sink for the worker delivery tests (README §16.3).
      mailpit:
        image: axllent/mailpit
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://redova:redova@localhost:5432/redova
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - name: Better Auth schema matches the plugin configuration (CHK-001-01)
        run: pnpm db:schema:check
      - name: Migrations apply on an empty database (AC-001-06)
        run: pnpm db:migrate
      - name: 'Integration tests (serialized: packages share the test database)'
        run: pnpm test:integration
      - name: Jest backend unit and HTTP security tests
        run: pnpm test:jest
      - name: Backend integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-coverage
          path: apps/server/coverage/integration/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: e2e
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: redova
          POSTGRES_PASSWORD: redova
          POSTGRES_DB: redova
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redova -d redova" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://redova:redova@localhost:5432/redova
      E2E_REDIS_URL: redis://localhost:6379
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_SMTP_PORT: '1025'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@redova/server --filter=@redova/worker
      - name: Chromium for the web onboarding journeys (mocked API)
        run: pnpm --filter @redova/web exec playwright install --with-deps chromium
      - name: Six API journeys, audit journey and secret-free logs
        run: pnpm test:e2e
      - name: Server and worker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-process-logs
          path: apps/server/.e2e-logs/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit (high and critical are blocking)
        run: pnpm security:audit
      - name: Secret scan of full Git history and current source
        if: ${{ !cancelled() }}
        run: pnpm security:secrets
      - name: Prove that a planted credential is rejected
        if: ${{ !cancelled() }}
        run: pnpm security:secrets:self-test
      - name: Redacted secret scanning reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: test-results/security/*.json
          retention-days: 7
          if-no-files-found: warn

  git-hygiene:
    name: git-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-branch-name.mjs "$HEAD_REF"
      - name: Commit messages follow Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: No AI attribution in commits, PR title or PR body
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git log --format=%B "$BASE_SHA..$HEAD_SHA" | node scripts/check-attribution.mjs -
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/check-attribution.mjs -
