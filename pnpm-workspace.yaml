packages:
  - apps/*
  - packages/*

# pnpm 12 requires an explicit decision for every dependency with install scripts.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  simple-git-hooks: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - bullmq@6.5.3

# Security patches for transitive dependencies (pnpm audit gate, UM-008).
overrides:
  multer: ^2.5.0
