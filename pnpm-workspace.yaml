packages:
  - apps/*
  - packages/*

# pnpm 12 requires an explicit decision for every dependency with install scripts.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': set this to true or false
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: false
  simple-git-hooks: false
  unrs-resolver: false
